<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="referrer" content="strict-origin-when-cross-origin"><meta name="viewport" content="width=device-width, initial-scale=1"><title>INGS IPTV - Tráiler</title><style>html,body{margin:0;width:100%;height:100%;background:#000;color:white}iframe{border:0;width:100%;height:100%}</style></head><body><script>var id=new URLSearchParams(location.search).get('v');if(/^[A-Za-z0-9_-]{11}$/.test(id||'')){var f=document.createElement('iframe');f.title='Tráiler de YouTube';f.referrerPolicy='strict-origin-when-cross-origin';f.allow='autoplay; encrypted-media; fullscreen';f.allowFullscreen=true;f.src='https://www.youtube.com/embed/'+id+'?autoplay=1&rel=0&playsinline=1&origin='+encodeURIComponent(location.origin);document.body.appendChild(f)}else document.body.textContent='Tráiler no disponible';</script></body></html>
